<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10</title>
    <!-- Google Fonts hỗ trợ Tiếng Việt chuẩn 100% -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #e63946;
            --rose-gold: #e8a598;
            --rose-accent: #ff758c;
            --bg-dark: #0f051d;
            --bg-card: rgba(30, 15, 45, 0.75);
            --text-light: #fdf0ed;
            --gold: #ffb703;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Canvas hiệu ứng hoa rơi nền */
        #petal-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Music Toggle Button */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .music-btn:hover {
            transform: scale(1.1);
            background: var(--rose-accent);
        }

        .music-btn.playing i {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Header Header */
        .header-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-title h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            color: var(--rose-gold);
            text-shadow: 0 0 10px rgba(232, 165, 152, 0.5);
            margin-bottom: 5px;
        }

        .header-title h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            background: linear-gradient(45deg, #fff, #ffb703, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Wrapper Bức thư 3D */
        .envelope-wrapper {
            position: relative;
            width: 100%;
            max-width: 580px;
            margin: 0 auto;
            perspective: 1000px;
            cursor: pointer;
        }

        .envelope {
            position: relative;
            width: 100%;
            background: transparent;
            border-radius: 20px;
            overflow: visible;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .envelope-wrapper:hover .envelope {
            transform: translateY(-5px);
        }

        /* Bó hoa trên màn hình mở đầu */
        .cover-preview {
            padding: 20px 20px 35px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 390px;
            position: relative;
            isolation: isolate;
        }

        .cover-preview::before {
            content: "";
            position: absolute;
            z-index: -1;
            width: 290px;
            height: 290px;
            top: 15px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 117, 140, 0.2), transparent 70%);
        }

        .bouquet-art {
            width: min(100%, 310px);
            height: auto;
            overflow: visible;
            filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.3));
            transform-origin: 50% 85%;
            animation: bouquet-sway 4s ease-in-out infinite;
        }

        @keyframes bouquet-sway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        .tap-instruction {
            font-size: 1.1rem;
            color: var(--rose-gold);
            letter-spacing: 1px;
            animation: blink 1.5s infinite;
            text-shadow: 0 2px 12px rgba(15, 5, 29, 0.8);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Nội dung Bức thư khi Mở */
        .letter-content {
            display: none;
            padding: 40px 35px;
            background: linear-gradient(145deg, rgba(57, 20, 43, 0.94), rgba(20, 8, 30, 0.94));
            backdrop-filter: blur(15px);
            border-radius: 16px;
            position: relative;
            border: 1px solid rgba(232, 165, 152, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45), 0 0 25px rgba(255, 117, 140, 0.12);
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ô nhập tên linh hoạt */
        .recipient-box {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px dashed rgba(232, 165, 152, 0.4);
            padding-bottom: 12px;
        }

        .recipient-label {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--rose-gold);
            margin-right: 10px;
            white-space: nowrap;
        }

        .recipient-input {
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: #ffffff;
            font-weight: 700;
            width: 100%;
            border-bottom: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .recipient-input:focus {
            border-bottom-color: var(--rose-accent);
        }

        /* Văn bản Lời Chúc */
        .wish-body {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #f1e3e4;
            font-weight: 300;
            min-height: 160px;
        }

        .wish-body p {
            margin-bottom: 15px;
            text-align: justify;
        }

        .wish-body strong {
            color: #fff;
            font-weight: 600;
        }

        /* Khung điều khiển / Action Buttons */
        .action-bar {
            display: flex;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 117, 140, 0.6);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: var(--rose-gold);
        }

        .btn-gold {
            background: linear-gradient(45deg, #ffb703, #fb8500);
            color: #000;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.3);
            margin-left: auto;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 183, 3, 0.5);
        }

        /* Modal / Pop-up Thẻ may mắn */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: linear-gradient(135deg, #2b1020, #42122b);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow: 0 0 30px rgba(255, 183, 3, 0.4);
            animation: zoomIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes zoomIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-card h3 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .modal-card p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #f1e3e4;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: #fff;
        }

        /* Footer */
        .footer-text {
            margin-top: 30px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header-title h1 { font-size: 1.6rem; }
            .header-title h2 { font-size: 2.2rem; }
            .cover-preview { padding: 15px 10px 25px; min-height: 340px; }
            .bouquet-art { width: min(100%, 270px); }
            .letter-content { padding: 25px 20px; }
            .recipient-label, .recipient-input { font-size: 1.3rem; }
            .btn { width: 100%; justify-content: center; }
            .btn-gold { margin-left: 0; }
        }
    </style>
</head>
<body>

    <!-- Canvas Cánh hoa rơi -->
    <canvas id="petal-canvas"></canvas>

    <!-- Nút Nhạc Nền -->
    <button class="music-btn" id="musicToggle" title="Bật/Tắt Nhạc Nền">
        <i class="fa-solid fa-music"></i>
    </button>

    <div class="container">
        <!-- Tiêu đề chính -->
        <div class="header-title">
            <h2>Happy Women's Day</h2>
            <h1>20 - 10</h1>
        </div>

        <!-- Bó hoa gửi lời chúc -->
        <div class="envelope-wrapper" id="envelopeWrapper">
            <div class="envelope">
                <!-- Bó hoa trên màn hình mở đầu -->
                <div class="cover-preview" id="coverPreview">
                    <svg class="bouquet-art" viewBox="0 0 300 280" role="img" aria-label="Bó hoa nhiều màu được gói giấy">
                        <defs>
                            <linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#f8d9b8"/>

                            </linearGradient>
                            <linearGradient id="petalPink" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#ffd0dc"/>
                                <stop offset="1" stop-color="#f04f79"/>
                            </linearGradient>
                            <linearGradient id="petalPeach" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#ffe2a8"/>
                                <stop offset="1" stop-color="#ff8b72"/>
                            </linearGradient>
                        </defs>
                        <g fill="none" stroke="#64855c" stroke-width="5" stroke-linecap="round">
                            <path d="M148 132 135 237M151 130 164 237M129 142 150 237M173 142 155 237M107 151 146 237M195 149 160 237"/>
                        </g>
                        <g fill="#84a978">
                            <path d="M132 181c-27-28-45-12-35 3 9 13 23 12 35-3Z"/>

                            <path d="M112 205c-22-20-36-7-27 6 8 11 18 9 27-6Z"/>
                            <path d="M183 210c20-21 35-9 26 4-8 11-18 10-26-4Z"/>
                            <path d="M145 163c-20-25-38-16-31 0 6 13 20 14 31 0Z"/>
                            <path d="M159 164c19-25 37-16 30 0-6 13-19 14-30 0Z"/>
                        </g>
                        <g>
                            <g transform="translate(105 103)">
                                <circle r="25" fill="url(#petalPink)"/>
                                <circle cx="-10" cy="-5" r="11" fill="#ffb3c7"/>
                                <circle cx="8" cy="-9" r="12" fill="#ff8cab"/>
                                <circle cx="9" cy="9" r="12" fill="#f75f89"/>
                                <circle cx="-9" cy="10" r="11" fill="#ff9bb5"/>
                                <circle r="8" fill="#ffe3a5"/>
                            </g>
                            <g transform="translate(151 76)">
                                <circle r="29" fill="url(#petalPeach)"/>
                                <circle cx="-12" cy="-7" r="13" fill="#ffe7ad"/>
                                <circle cx="9" cy="-12" r="14" fill="#ffb37e"/>
                                <circle cx="13" cy="9" r="13" fill="#ff8c72"/>
                                <circle cx="-9" cy="13" r="13" fill="#ffc18c"/>
                                <circle r="9" fill="#fff0bb"/>
                            </g>
                            <g transform="translate(199 105)">
                                <circle r="25" fill="url(#petalPink)"/>
                                <circle cx="-10" cy="-5" r="11" fill="#ffb3c7"/>
                                <circle cx="8" cy="-9" r="12" fill="#ff8cab"/>
                                <circle cx="9" cy="9" r="12" fill="#f75f89"/>
                                <circle cx="-9" cy="10" r="11" fill="#ff9bb5"/>
                                <circle r="8" fill="#ffe3a5"/>
                            </g>
                            <g transform="translate(127 143) scale(.78)">
                                <circle r="24" fill="#fff0b5"/>
                                <circle cx="-10" cy="-5" r="11" fill="#fff8d8"/>
                                <circle cx="8" cy="-9" r="12" fill="#ffd66f"/>
                                <circle cx="9" cy="9" r="12" fill="#ffb847"/>
                                <circle cx="-9" cy="10" r="11" fill="#ffe28a"/>
                                <circle r="7" fill="#fff4c7"/>
                            </g>
                            <g transform="translate(178 144) scale(.8)">
                                <circle r="24" fill="#e7b8ff"/>
                                <circle cx="-10" cy="-5" r="11" fill="#f2d9ff"/>
                                <circle cx="8" cy="-9" r="12" fill="#ca8bea"/>
                                <circle cx="9" cy="9" r="12" fill="#b76bd6"/>
                                <circle cx="-9" cy="10" r="11" fill="#dda9f0"/>
                                <circle r="7" fill="#fff0b5"/>
                            </g>
                        </g>
                        <path d="m91 143 31 99q28 17 58 0l31-99q-59 28-120 0Z" fill="url(#wrap)" stroke="#f5c7b4" stroke-width="2"/>
                        <path d="m91 143 51 100 9-92-24-24Z" fill="#fff0d7" opacity=".75"/>
                        <path d="m211 143-51 100-9-92 24-24Z" fill="#c9797d" opacity=".55"/>
                        <path d="M135 228c-10 9-12 22-2 28 8 5 15-4 17-12 3 9 11 16 18 10 9-8 3-20-8-27l-11 9-14-8Z" fill="#c94369" stroke="#f4b0a5" stroke-width="2"/>
                    </svg>
                    <p class="tap-instruction">Chạm vào bó hoa để nhận lời chúc <i class="fa-solid fa-arrow-right"></i></p>
                </div>

                <!-- Bức thư bên trong khi click mở -->
                <div class="letter-content" id="letterContent">
                    <div class="recipient-box">
                        <span class="recipient-label">Gửi</span>
                        <input type="text" class="recipient-input" id="recipientName" value="Em" placeholder="Nhập tên..." title="Nhấn vào để thay đổi tên">
                        <i class="fa-solid fa-pen" style="font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-left: 5px;"></i>
                    </div>

                    <div class="wish-body" id="wishText">
                        <!-- Nội dung lời chúc sẽ tự động nạp bằng JS -->
                    </div>

                    <div class="action-bar">
                        <button class="btn btn-outline" id="nextWishBtn">
                            <i class="fa-solid fa-rotate"></i> Đổi lời chúc khác
                        </button>
                        <button class="btn btn-outline" id="copyBtn">
                            <i class="fa-solid fa-copy"></i> Sao chép
                        </button>
                        <button class="btn btn-gold" id="surpriseBtn">
                            Rút Thẻ May Mắn <i class="fa-solid fa-star"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-text">
            Chúc em có một ngày 20/10 thật vui và nhiều điều dễ thương!
        </div>
    </div>

    <!-- Modal Thẻ May Mắn -->
    <div class="modal" id="wishModal">
        <div class="modal-card">
            <button class="close-btn" id="closeModal">&times;</button>
            <div style="font-size: 3rem; color: var(--gold); margin-bottom: 10px;">
                <i class="fa-solid fa-gift"></i>
            </div>
            <h3 id="cardTitle">Món Quà Tinh Thần</h3>
            <p id="cardContent">Chúc em có một ngày 20/10 vui vẻ, làm gì cũng thuận lợi và có thời gian dành cho những điều mình thích nhé!</p>
            <button class="btn btn-primary" id="modalOkBtn" style="width: 100%; justify-content: center;">Nhận Lời Chúc</button>
        </div>
    </div>

    <script>
        // Các lời chúc 20/10
        const wishes = [
            `Chúc em ngày 20/10 vui vẻ nhé! Cảm ơn em vì đã luôn quan tâm và ở bên mọi người. Mong em có một ngày thật thoải mái, làm những điều mình thích và nhận được thật nhiều lời chúc dễ thương.`,
            
            `Nhân ngày 20/10, chúc em luôn vui vẻ, khỏe mạnh và gặp nhiều may mắn. Mong công việc và những dự định của em đều tiến triển thật tốt.`,
            
            `Chúc em có một ngày 20/10 thật vui bên gia đình, bạn bè và những người em quý mến. Nhớ dành chút thời gian nghỉ ngơi và chiều chuộng bản thân nữa nhé!`,
            
            `Chúc mừng ngày 20/10! Mong em luôn giữ được sự tự tin, thoải mái là chính mình và có thật nhiều ngày vui trong thời gian tới.`,
            
            `Ngày 20/10 vui vẻ nha em. Chúc em mọi việc thuận lợi, gặp nhiều người tốt và lúc nào cũng có lý do để mỉm cười.`
        ];

        // Danh sách thẻ may mắn bất ngờ
        const luckyCards = [
            { title: "Thẻ Nghỉ Ngơi", text: "Nhắc em dành chút thời gian nghỉ ngơi hôm nay, làm điều gì đó khiến em thấy vui nhé." },
            { title: "Thẻ Tự Tin", text: "Chúc em luôn tự tin với lựa chọn của mình. Cứ đi từng bước theo cách em thấy phù hợp nhé." },
            { title: "Thẻ Niềm Vui", text: "Chúc hôm nay em gặp được vài chuyện vui nho nhỏ và có một ngày thật dễ chịu." },
            { title: "Thẻ May Mắn", text: "Chúc những dự định sắp tới của em diễn ra suôn sẻ. Cố lên, em làm được mà!" }
        ];

        let currentWishIndex = 0;
        let isOpened = false;

        // DOM Elements
        const envelopeWrapper = document.getElementById('envelopeWrapper');
        const coverPreview = document.getElementById('coverPreview');
        const letterContent = document.getElementById('letterContent');
        const wishText = document.getElementById('wishText');
        const recipientInput = document.getElementById('recipientName');
        const nextWishBtn = document.getElementById('nextWishBtn');
        const copyBtn = document.getElementById('copyBtn');
        const surpriseBtn = document.getElementById('surpriseBtn');
        const wishModal = document.getElementById('wishModal');
        const closeModal = document.getElementById('closeModal');
        const modalOkBtn = document.getElementById('modalOkBtn');
        const cardTitle = document.getElementById('cardTitle');
        const cardContent = document.getElementById('cardContent');

        // Hiển thị lời chúc
        function renderWish() {
            wishText.innerHTML = wishes[currentWishIndex];
        }

        // Mở thư 3D
        envelopeWrapper.addEventListener('click', function(e) {
            if (!isOpened) {
                // Tránh trigger khi tương tác bên trong
                if (e.target.closest('#letterContent')) return;
                
                coverPreview.style.display = 'none';
                letterContent.style.display = 'block';
                isOpened = true;
                renderWish();

                // Bắn hiệu ứng Confetti pháo hoa
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ff758c', '#e8a598', '#ffb703', '#ffffff']
                });

                // Khởi động âm nhạc nếu chưa bật
                initAudio();
            }
        });

        // Đổi lời chúc khác
        nextWishBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            currentWishIndex = (currentWishIndex + 1) % wishes.length;
            renderWish();
            
            confetti({
                particleCount: 30,
                spread: 50,
                origin: { y: 0.7 }
            });
        });

        // Sao chép lời chúc
        copyBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const textToCopy = `Gửi ${recipientInput.value},\n\n` + wishText.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = copyBtn.innerHTML;
                copyBtn.innerHTML = `<i class="fa-solid fa-check"></i> Đã sao chép!`;
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                }, 2000);
            });
        });

        // Mở thẻ may mắn
        surpriseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const randomCard = luckyCards[Math.floor(Math.random() * luckyCards.length)];
            cardTitle.innerText = randomCard.title;
            cardContent.innerText = randomCard.text;
            wishModal.style.display = 'flex';

            confetti({
                particleCount: 100,
                spread: 100,
                origin: { y: 0.5 }
            });
        });

        // Đóng Modal
        closeModal.addEventListener('click', () => wishModal.style.display = 'none');
        modalOkBtn.addEventListener('click', () => wishModal.style.display = 'none');
        wishModal.addEventListener('click', (e) => {
            if (e.target === wishModal) wishModal.style.display = 'none';
        });

        /* --- Canvas Hiệu ứng Cánh Hoa Rơi --- */
        const canvas = document.getElementById('petal-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Petal {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -100;
                this.size = Math.random() * 8 + 6;
                this.speedY = Math.random() * 1.2 + 0.8;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = Math.random() * 0.02 - 0.01;
                this.color = `rgba(${Math.floor(230 + Math.random() * 25)}, ${Math.floor(100 + Math.random() * 50)}, ${Math.floor(130 + Math.random() * 50)}, ${Math.random() * 0.4 + 0.4})`;
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.angle) * 0.5 + this.speedX;
                this.angle += this.spin;

                if (this.y > canvas.height + 20) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.fillStyle = this.color;
                // Vẽ hình cánh hoa
                ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const petals = Array.from({ length: 45 }, () => new Petal());

        function animatePetals() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            petals.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animatePetals);
        }
        animatePetals();

        /* --- Sound / Piano Synth bằng Web Audio API --- */
        let audioCtx = null;
        let isPlaying = false;
        let timerId = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!isPlaying) {
                isPlaying = true;
                document.getElementById('musicToggle').classList.add('playing');
                playMelody();
            }
        }

        function playNote(freq, duration) {
            if (!audioCtx || !isPlaying) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23, 329.63, 293.66]; // Đô Mì Sol Đố La Fa Mì Rê
        let noteIdx = 0;

        function playMelody() {
            if (!isPlaying) return;
            playNote(notes[noteIdx], 2.5);
            noteIdx = (noteIdx + 1) % notes.length;
            timerId = setTimeout(playMelody, 1200);
        }

        document.getElementById('musicToggle').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!audioCtx) {
                initAudio();
                return;
            }
            if (isPlaying) {
                isPlaying = false;
                clearTimeout(timerId);
                document.getElementById('musicToggle').classList.remove('playing');
            } else {
                initAudio();
            }
        });
    </script>
</body>
</html>
